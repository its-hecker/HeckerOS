name: Hecker Recovery 2.0 boot integration host checks

on:
  push:
    branches: [feat/hecker-recovery-2.0]
    paths:
      - 'tools/recovery2_*.py'
      - 'recovery/rom/**'
      - 'tests/test_recovery2_*.py'
      - '.github/workflows/hecker-recovery2-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-compat-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Coral boot routing and both ramdisks
        run: python3 -m unittest discover -s tests -p 'test_recovery2_*.py' -v
