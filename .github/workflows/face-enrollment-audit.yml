name: Stock Pixel enrollment compatibility audit
on:
  push:
    paths:
      - .github/workflows/face-enrollment-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect pinned Pixel Settings enrollment classes without running them
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/Evolution-X/vendor_pixel-framework/5c7520b9a7b4e08abf96ce95e8bf087ee851d920/SettingsGoogle/libs/SettingsGoogle-lib.jar' \
            --output /tmp/pixel-settings.jar
          python3 - <<'PYTHON'
          import hashlib, subprocess, zipfile
          from pathlib import Path
          raw=Path('/tmp/pixel-settings.jar').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == 'a91c47b1b6361c61cb5bb8dfcae776aacfda4e05'
          with zipfile.ZipFile('/tmp/pixel-settings.jar') as archive:
              names=[n[:-6].replace('/', '.') for n in archive.namelist() if n.endswith('.class') and '/biometrics/face/' in n]
          print('Verified Google Settings library; face classes:',len(names),flush=True)
          for name in names: print(name,flush=True)
          for name in names:
              if name in ('com.google.android.settings.biometrics.face.FaceUtils', 'com.google.android.settings.biometrics.face.Debouncer'):
                  print('\nDECLARATIONS:',name,flush=True)
                  subprocess.run(['javap','-p','-c','-classpath','/tmp/pixel-settings.jar',name],check=True)
          root=Path('prebuilts/pixel-face-ui');root.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile('/tmp/pixel-settings.jar') as source, zipfile.ZipFile(root/'stock-pose-grid.jar','w') as target:
              selected=[n for n in source.namelist() if n.endswith('.class') and (
                  n.startswith('com/google/android/settings/biometrics/face/anim/curve/') or
                  n.startswith('com/google/android/settings/biometrics/face/anim/FaceEnrollAnimationMultiAngleDrawable'))]
              for n in sorted(selected):
                  info=zipfile.ZipInfo(n,(1980,1,1,0,0,0));info.external_attr=0o100644<<16
                  target.writestr(info,source.read(n))
          print('Animation-only artifact:',len(selected),'classes;', (root/'stock-pose-grid.jar').stat().st_size,'bytes',flush=True)
          PYTHON
      - name: Preserve the isolated, pinned animation artifact
        run: |
          git config user.name 'HeckerOS build bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prebuilts/pixel-face-ui/stock-pose-grid.jar
          if ! git diff --cached --quiet; then
            git commit -m 'Extract pinned Pixel pose-grid animation classes without enrollment activities'
            git push origin HEAD:main
          fi
